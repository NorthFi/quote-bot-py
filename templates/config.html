<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Motivational Bot Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<style>
  .api-card { transition: 0.3s; }
  .api-card:hover { transform: scale(1.02); }
</style>
</head>
<body class="bg-light">
<div class="container mt-5">
  <h2 class="text-center mb-4">Motivational Bot Dashboard</h2>

  <div class="row justify-content-center">
    <div class="col-md-6">
      <!-- Config Card -->
      <div class="card shadow mb-4">
        <div class="card-body">
          <h4 class="card-title">Bot Configuration</h4>
          <form method="post">
            <div class="mb-2">
              <label>Discord Bot Token</label>
              <input type="text" name="bot_token" value="{{ bot_token }}" class="form-control" required>
            </div>
            <div class="mb-2">
              <label>Channel ID</label>
              <input type="number" name="channel_id" value="{{ channel_id }}" class="form-control" required>
            </div>
            <div class="mb-2">
              <label>Interval (seconds)</label>
              <input type="number" name="interval_seconds" value="{{ interval_seconds }}" class="form-control" required>
            </div>
            <div class="form-check form-switch mt-2">
              <input class="form-check-input" type="checkbox" name="use_image_quotes" id="imageToggle" {% if use_image_quotes %}checked{% endif %}>
              <label class="form-check-label" for="imageToggle">Enable Image Quotes</label>
            </div>

            <!-- API Toggles -->
            <div class="mt-3">
              <h5>Active APIs</h5>
              {% for api in all_apis %}
              <div class="card api-card mb-2 p-2 d-flex justify-content-between align-items-center">
                <div><strong>{{ api }}</strong></div>
                <div class="d-flex gap-2">
                  <input class="form-check-input mt-1" type="checkbox" name="active_apis" value="{{ api }}"
                  {% if api in active_apis %}checked{% endif %}>
                  <button type="button" class="btn btn-sm btn-info preview-btn" data-api="{{ api }}">Preview</button>
                </div>
              </div>
              {% endfor %}
            </div>

            <button type="submit" class="btn btn-success w-100 mt-3">Save Configuration</button>
          </form>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="d-grid gap-2 mb-3">
        <form method="post" action="{{ url_for('activate_bot') }}">
          <button class="btn btn-primary" {% if bot_active %}disabled{% endif %}>Activate Bot</button>
        </form>
        <form method="post" action="{{ url_for('deactivate_bot') }}">
          <button class="btn btn-danger">Deactivate Bot</button>
        </form>
        <form method="post" action="{{ url_for('force_post') }}">
          <button class="btn btn-info">Force Post Quote</button>
        </form>
        <form method="post" action="{{ url_for('clear_messages') }}">
          <button class="btn btn-warning">Clear All Messages</button>
        </form>
      </div>

      <!-- Flash Messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert alert-info">{{ message }}</div>
        {% endfor %}
      {% endwith %}
    </div>
  </div>
</div>

<script>
  const buttons = document.querySelectorAll('.preview-btn');
  buttons.forEach(btn => {
    btn.addEventListener('click', async () => {
      const api = btn.dataset.api;
      btn.disabled = true;
      btn.innerText = "Loading...";
      try {
        const res = await axios.get(`/preview_quote?api=${encodeURIComponent(api)}`);
        alert(`Preview Quote from ${api}:\n\n${res.data.quote}\n— ${res.data.author}`);
      } catch {
        alert("Failed to fetch preview quote");
      } finally {
        btn.disabled = false;
        btn.innerText = "Preview";
      }
    });
  });
</script>
</body>
</html>
